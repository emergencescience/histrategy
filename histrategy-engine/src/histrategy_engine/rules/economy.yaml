# 三國志略 — Economy rule configuration
# All formulas are expressed as Python-evaluable expressions.
# Variables are injected at runtime by RuleInterpreter.
#
# =============================================================================
# ERA-SPECIFIC MODIFIERS
# Appended to base formulas based on scenario.era field:
#   "han"         → Three Kingdoms (default, no modifier)
#   "ming-qing"   → 17th century transition
# =============================================================================

food_production:
  formula: "population * yield_per_capita * (fertility/5) * (1 + development/100) * season_mod * climate_mod * gov_mod * tech_mod"
  era_modifiers:
    ming-qing:
      multiplier: 1.15  # New World crops (sweet potato, maize) boost yield
  constants:
    yield_per_capita: 0.010   # per-pop per-quarter base yield (matches civilian_per_capita scale)
    fertility_divisor: 5      # fertility 5 = neutral (1.0x)
    dev_divisor: 100

food_consumption:
  civilian_formula: "population * civilian_per_capita"
  troop_formula: "troops * troop_per_capita * supply_multiplier"
  # Gunpowder units consume extra supplies (ammunition, powder)
  gunpowder_supply_multiplier: 1.3
  constants:
    civilian_per_capita: 0.01     # 1% of population consumed per quarter (halved)
    troop_per_capita: 0.05         # 0.05 per troop (10x reduction — was 0.5)

population_growth:
  surplus_threshold_high: 1.2
  surplus_threshold_low: 1.0
  rate_healthy: 0.015
  rate_slow: 0.005
  rate_shortage: -0.01
  rate_famine: -0.03
  # Refugee/war migration
  war_refugee_rate: 0.02  # % of population fleeing per turn when territory is contested
  siege_attrition_rate: 0.03  # % population loss per turn under siege
  formula: "population * rate * (1 + morale/100) * (1 + development/200)"

tax:
  revenue_formula: "population * tax_rate * tax_base_multiplier * gov_mod"
  era_modifiers:
    ming-qing:
      # Silver economy: trade-based tax boost for coastal territories
      coastal_tax_multiplier: 1.4
      # Gunpowder maintenance cost
      gunpowder_tax_overhead: 0.02  # additional 2% tax overhead per turn
  moral_thresholds:
    - threshold: 0.2
      penalty: 0
    - threshold: 0.3
      penalty: -1
    - threshold: 0.4
      penalty: -2
    - threshold: 999.0
      penalty: -3
  constants:
    tax_base_multiplier: 0.05

# ── Maritime Trade Income ──
# Coastal territories with development > 30 generate trade income.
# Critical for Zheng faction identity.
maritime_trade:
  formula: "has_coast * development * trade_base * trade_multiplier * (1 + port_level * 0.15)"
  era_modifiers:
    ming-qing:
      trade_multiplier: 1.5  # 17th century global trade boom
  constants:
    trade_base: 50  # gold per development point
    port_level_default: 1

development:
  cost_formula: "150 * delta * sqrt(population/1000)"
  constants:
    minimum_cost: 300

unrest:
  formula: "base_unrest_change + tax_unrest_factor * tax_rate + food_unrest_factor * (1.0 - food_ratio)"
  # Siege-specific unrest
  siege_unrest_penalty: 5  # +5 unrest per turn under siege
  constants:
    base_unrest_change: -1
    tax_unrest_factor: 15
    food_unrest_factor: 10

fortification:
  formula: "base_decay + maintenance"
  # Gunpowder-era fortification: walls are less effective against cannon
  era_modifiers:
    ming-qing:
      fort_effectiveness: 0.7  # 30% reduction vs cannons
  constants:
    base_decay: -1
    maintenance: 1

modifiers:
  governor_politics: "1 + politics/200"
  tech_agriculture: "1 + agriculture_level * 0.1"
  # Gunpowder tech affects combat power
  tech_gunpowder: "1 + gunpowder_level * 0.15"
