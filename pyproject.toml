[project]
name = "histrategy"
version = "0.1.0"
description = "三國志略 - A text-based history strategy game powered by AI"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
histrategy = "histrategy.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["scripts/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "F405",  # undefined name from star imports (offline_sim & world.py)
    "F821",  # undefined name (template engine TYPE_CHECKING)
]

[tool.ruff.lint.isort]
known-first-party = ["histrategy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
