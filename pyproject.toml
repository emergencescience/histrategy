[project]
name = "histrategy"
version = "0.2.1"
description = "三國志略 - A text-based history strategy game powered by AI"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "PyJWT>=2.8.0",
]
db = [
    "psycopg2-binary>=2.9",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "PyJWT>=2.8.0",
    "psycopg2-binary>=2.9",
]

[project.scripts]
histrategy = "histrategy.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["scripts/", "histrategy-engine/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "F405",  # undefined name from star imports (offline_sim & world.py)
    "F821",  # undefined name (template engine TYPE_CHECKING)
    "E402",  # module-level import not at top — intentional lazy imports to avoid circular deps / cold-start cost
    "B008",  # FastAPI Body(...) in arg defaults is the documented pattern
    "B904",  # raise ... from — pre-existing exception chains
    "B007",  # loop control variable unused — pre-existing
    "E731",  # lambda assignment — pre-existing
    "C401",  # set comprehension suggestion — pre-existing
    "SIM",   # flake8-simplify style suggestions — not formatting, defer refactor
]

[tool.ruff.lint.per-file-ignores]
# Narrative/data strings exceed 120 chars; splitting would harm readability
"histrategy/server/single_player.py" = ["E501"]
"histrategy/llm/npc_decision_engine.py" = ["E501"]
"histrategy/llm/narrative.py" = ["E501"]
"histrategy/engine/intro_plan.py" = ["E501"]
"histrategy/engine/helpers.py" = ["E501"]
"histrategy/engine/fast_path.py" = ["E501"]
"histrategy/server/room_manager.py" = ["E501"]
"histrategy/llm/advisor.py" = ["E501"]
"histrategy/server/api.py" = ["E501"]
"histrategy/engine/turn_processor.py" = ["E501"]
"histrategy/engine/state_applier.py" = ["E501"]
"histrategy/engine/quarterly_engine.py" = ["E501"]
"histrategy/engine/game_room.py" = ["E501"]
"histrategy/llm/narrative_context.py" = ["E501"]
"histrategy/engine/quarterly_resolver.py" = ["E501"]
"histrategy/engine/v1_simulator.py" = ["E501"]
"histrategy/parser/intent.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["histrategy"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
