[project]
name = "histrategy"
version = "0.1.0"
description = "三國志略 - A text-based history strategy game powered by AI"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
histrategy = "histrategy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
