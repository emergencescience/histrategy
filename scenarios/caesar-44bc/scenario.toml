# 凯撒余烬 Ashes of Caesar — Scenario Configuration
# histrategy/scenarios/caesar-44bc/scenario.toml
#
# 公元前44年-前30年罗马内战，4 势力非对称设计

[meta]
id = "caesar-44bc"
name = "凯撒余烬"
name_en = "Ashes of Caesar"
era = "罗马共和国末期 (44 BC - 30 BC)"
start_year = -43
start_season = "春"
end_year = -29
description = """
恺撒被刺，罗马共和国在血与火中走向终结。
屋大维（继承者）、安东尼（将军）、克利奥帕特拉（埃及法老）、
元老院（共和国守护者）——四方争夺恺撒留下的余烬。
"""

[engine]
default_version = "v3"
quarter_per_year = 4
quarters = ["春", "夏", "秋", "冬"]
year_direction = "negative"
turn_timeout_human = 300
turn_timeout_ai = 120
max_quarters = 60

[factions]
available = ["octavian", "antony", "cleopatra", "senate"]
npc_only = ["sextus_pompey", "lepidus", "brutus", "parthia"]
major_npc = ["octavian", "antony", "cleopatra", "senate"]
minor_npc = ["sextus_pompey", "lepidus", "brutus", "parthia"]
default_player_faction = "octavian"

[display]
icon = "🏛️"
color_scheme = "roman"
map_svg = "web/map.svg"
language = "en"
languages = ["en", "zh-CN"]
style = "epic"

[knowledge]
factions_file = "factions.json"
characters_file = "characters.json"
regions_file = "regions.json"
events_file = "events.json"
arc_goals_file = "arc_goals.json"
roster_file = "roster.json"
territories_file = "territories.json"
timeline_file = "timeline.json"
initial_state_file = "initial_state.json"

[llm]

[db]
scenario_id_column = "scenario"
