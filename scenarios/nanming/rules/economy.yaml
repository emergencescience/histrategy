# ============================================================
# Economy Rules — Nanming (Southern Ming) v2 Deterministic Engine
#
# 1645-1662 南明时期经济规则
# 南方稻作经济 vs 北方麦作经济，海商贸易，士气影响税收
# ============================================================

food:
  # Base food production per territory per quarter
  # Southern rice paddies yield more, northern wheat less
  base_per_territory: 500
  pop_contribution_rate: 0.02

  # Season multipliers
  season_mult:
    spring: 0.4
    summer: 1.0
    autumn: 1.3
    winter: 0.3

  # Development multiplier
  dev_multiplier: 0.01
  fertility_mult: 0.05

  # ─── Nanming-specific: Regional food modifiers ───
  regional_bonus:
    # Southern territories (rice-based): higher grain yield
    south_rice_bonus: 1.2        # +20% food in southern territories
    # Northern territories (wheat-based): lower yield but horse resource
    north_wheat_penalty: 0.85    # -15% food in northern territories

  # Winter consumption penalty — harsher in north
  winter_consumption:
    south_mult: 1.3               # +30% food consumption in southern winter
    north_mult: 1.8               # +80% food consumption in northern winter

  # Horse resource from northern territories (no direct food, but strategic)
  horse_production:
    north_per_territory: 50       # abstract horse units per northern territory/quarter
    south_per_territory: 5        # minimal horses from south

tax:
  base_economy_divisor: 100
  min_rate: 0.10
  max_rate: 0.50
  default_rate: 0.30

  morale_thresholds:
    - rate: 0.10
      morale_delta: 2
    - rate: 0.30
      morale_delta: 0
    - rate: 0.40
      morale_delta: -1
    - rate: 0.50
      morale_delta: -3

  corruption_base: 0.05
  corruption_per_dev_below_50: 0.01

  # ─── Nanming-specific: Morale affects tax collection ───
  morale_tax_efficiency:
    # Tax actually collected = tax_revenue × efficiency(morale)
    # efficiency = 0.5 at morale 0, 1.0 at morale 50, 1.2 at morale 100
    base: 0.5
    per_morale_point: 0.01       # +1% efficiency per morale point

population:
  growth_rate: 0.005
  growth_morale_mult: 0.0001
  growth_food_mult: 0.0005
  starvation_threshold: 0
  starvation_rate: 0.03
  pestilence_mortality: 0.10

  # ─── Nanming-specific: War refugee displacement ───
  # When a territory changes hands, population flees
  refugee_rate: 0.15             # 15% of population flees when territory captured

development:
  base_cost: 500
  cost_per_current_dev: 10
  max_development: 100
  food_bonus_per_point: 10
  tax_bonus_per_point: 5

morale:
  base: 50
  max: 100
  min: 0
  victory_bonus: 5
  defeat_penalty: -8
  territory_lost_penalty: -3
  territory_gained_bonus: 4
  conscription_penalty: -2
  starvation_penalty: -5
  leadership_bonus: 1

  # ─── Nanming-specific: Dynasty legitimacy morale effect ───
  # Nanming loses extra morale per territory lost (dynasty in crisis)
  legitimacy_decay: 0.5          # -0.5 extra morale per territory lost (nanming only)

treasury:
  commerce_per_territory: 200
  commerce_dev_mult: 0.01

  # ─── Nanming-specific: Maritime trade ───
  maritime_trade:
    # Zheng faction bonus: +50% commerce from coastal territories
    zheng_bonus: 1.5
    # Other factions: +10% from coastal territories
    other_coastal_bonus: 1.1
    # Trade route income (Zheng only, if controls key ports)
    route_income: 300             # per controlled major port per quarter
