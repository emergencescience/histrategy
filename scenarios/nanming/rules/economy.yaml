# ============================================================
# Economy Rules — Southern Ming (山河鼎革)
#
# Adapted for late Ming dynasty economy:
#   - Southern rice economy (higher base yield)
#   - Maritime trade income for coastal territories
#   - Silver-based treasury (明末白银经济)
#   - War devastation impact on northern territories
# ============================================================

food:
  # Base food production per territory per quarter
  # Southern rice paddies produce more than northern wheat
  base_per_territory: 600

  # Food consumption — troops consume less in late Ming (self-supplied/foraging)
  food_consumption:
    civilian_formula: "population * civilian_per_capita"
    troop_formula: "troops * troop_per_capita * supply_multiplier"
    constants:
      civilian_per_capita: 0.02
      troop_per_capita: 0.15   # Reduced from 0.5: 10K troops = 1,500 food/qtr (sustainable)

  # Population contribution to food output
  pop_contribution_rate: 0.02  # food = pop × 0.02
  # Season multipliers (applied on top)
  season_mult:
    spring: 0.5    # planting season
    summer: 1.1    # growing season
    autumn: 1.4    # harvest season (rice)
    winter: 0.3    # stored grain
  # Development multiplier: each development point = 1% more food
  dev_multiplier: 0.01
  # Fertility contribution
  fertility_mult: 0.05  # each fertility point = 5% more
  # Climate zone bonus (south = rice = more food)
  climate_mult:
    south: 1.2
    central: 1.0
    north: 0.8

tax:
  # Tax revenue = tax_rate × population × economy / 100
  base_economy_divisor: 100
  # Tax rate limits
  min_rate: 0.05    # 5% minimum (peasant armies tax very little)
  max_rate: 0.50    # 50% maximum
  default_rate: 0.30

  # Morale impact of tax rate
  morale_thresholds:
    - rate: 0.10
      morale_delta: 2      # light taxes → +2 morale/quarter
    - rate: 0.20
      morale_delta: 1
    - rate: 0.30
      morale_delta: 0      # moderate taxes → neutral
    - rate: 0.40
      morale_delta: -1     # heavy taxes → -1 morale/quarter
    - rate: 0.50
      morale_delta: -3     # crushing taxes → -3 morale/quarter

  # Corruption: tax_revenue × corruption_rate is lost
  corruption_base: 0.05    # 5% base corruption
  corruption_per_dev_below_50: 0.01  # +1% per development point below 50

maritime_trade:
  # Additional income for coastal territories (unique to Nanming scenario)
  # Trade income = base × commerce_tech_level × development / 100
  base_per_coastal_territory: 300
  commerce_tech_mult: 0.2     # +20% per commerce tech level
  blockade_penalty: 0.7       # 70% reduction if blockaded by enemy navy

population:
  # Population growth per quarter
  growth_rate: 0.004        # 0.4% base growth (lower due to war)
  growth_morale_mult: 0.0001 # +0.01% per morale point above 50
  growth_food_mult: 0.0005  # +0.05% per 1000 surplus food
  # Population decline from starvation
  starvation_threshold: 0
  starvation_rate: 0.03     # 3% die per quarter of starvation
  # War devastation
  war_devastation_mortality: 0.05  # 5% population loss when territory changes hands
  # Massacre events (扬州十日 type)
  massacre_mortality: 0.30   # 30% population loss from massacre events

development:
  base_cost: 500            # gold
  cost_per_current_dev: 10  # +10 gold per existing development point
  max_development: 100
  food_bonus_per_point: 10  # +10 food per dev point per quarter
  tax_bonus_per_point: 5     # +5 gold per dev point per quarter

morale:
  base: 50
  max: 100
  min: 0
  victory_bonus: 5
  defeat_penalty: -8
  territory_lost_penalty: -3
  territory_gained_bonus: 4
  conscription_penalty: -2
  starvation_penalty: -5
  leadership_bonus: 1        # per point of ruler charisma above 50
  # Faction-specific morale effects
  faction_modifiers:
    nanming:
      internal_strife_penalty: -2  # -2 per quarter due to party conflict
      loyalist_bonus: 3            # +3 if capital under siege (desperation)
    qing:
      conquest_momentum: 2         # +2 per victory (momentum)
      han_resistance_penalty: -1    # -1 per quarter in non-Manchu territories
    nongminjun:
      looting_bonus: 5             # +5 for capturing territory (loot morale)
      governance_penalty: -3       # -3 for holding territory >2 quarters
    zheng:
      trade_prosperity_bonus: 2    # +2 if maritime trade uninterrupted
      isolation_penalty: -1        # -1 if no allied factions

treasury:
  commerce_per_territory: 200
  commerce_dev_mult: 0.01    # +1% per development point
  # Silver economy — Southern Ming had significant silver reserves
  silver_bonus_south: 150    # +150 per southern territory per quarter
