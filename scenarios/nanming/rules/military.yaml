# ============================================================
# Military Rules — Southern Ming (山河鼎革)
#
# Adapted for 17th century warfare:
#   - Gunpowder weapons (arquebus, cannon)
#   - Eight Banners (八旗) elite cavalry
#   - Naval warfare (郑氏水师 dominates sea)
#   - Peasant armies (large numbers, low quality)
#   - River defense (长江天险)
# ============================================================

recruitment:
  max_rate: 0.05              # 5% of territory population per quarter
  labor_floor: 0.25           # Below 25% of original pop, conscription blocked
  morale_penalty_per_draft: 2
  consecutive_decay: 0.02     # Each consecutive draft quarter reduces rate by 2%

  cost:
    infantry: 3     # gold per soldier
    cavalry: 12     # gold per horseman (horses expensive in south)
    archer: 6       # gold per archer
    arquebusier: 8  # gold per gunpowder infantry (new unit type)
    navy: 8          # gold per sailor
    cannon: 15       # gold per artillery piece (abstracted)

supply:
  base_per_1000: 100
  terrain_modifier:
    plains: 1.0
    hills: 1.3
    mountain: 1.8
    coast: 1.0
    river: 1.1
  distance_decay_pct: 5       # 5% extra per territory step
  siege_defender_bonus: 0.5   # Defenders in siege consume 50% less
  winter_multiplier: 1.5      # Winter adds 50% to all supply consumption

combat:
  unit_power:
    infantry: 1.0
    cavalry: 1.8
    archer: 1.3
    arquebusier: 1.5    # gunpowder weapons — strong but slow reload
    navy: 0.6            # weak on land
    cannon: 2.0          # powerful in siege, weak in field

  # Faction-specific unit bonuses
  faction_unit_bonus:
    qing:
      cavalry: 1.3        # Eight Banners — best cavalry in the world
      description: "八旗骑兵天下无敌"
    zheng:
      navy: 2.0           # Dominant navy — can't be challenged at sea
      description: "郑氏水师东亚最强"
    nongminjun:
      infantry_cost_mult: 0.5  # Half cost for peasant conscripts
      infantry_power_mult: 0.7 # But lower quality
      description: "农民军数量庞大但训练不足"
    nanming:
      arquebusier: 1.2    # Better firearms from European trade
      description: "南明火器精良，得自澳门葡萄牙人"

  # Rock-paper-scissors multipliers
  counter:
    cavalry_vs_infantry: 1.5
    cavalry_vs_arquebusier: 0.8  # Gunpowder counters cavalry
    archer_vs_cavalry: 1.4
    arquebusier_vs_cavalry: 1.6   # Arquebus especially deadly vs cavalry
    infantry_vs_archer: 1.3
    cannon_vs_wall: 2.5           # Cannon vs fortifications
    navy_vs_transport: 2.0        # Warships vs transport ships

  terrain_defense:
    mountain: 2.0
    hills: 1.5
    forest: 1.3
    coast: 1.1
    river: 1.4
    plains: 1.0

  morale_power_mult: 0.01
  collapse_threshold: 20
  rout_casualty_mult: 1.8
  leader_bonus_max: 1.25

  battle_resolution:
    decisive_victory_ratio: 2.0
    victory_ratio: 1.3
    draw_range: [0.77, 1.3]
    defeat_ratio: 0.5

mobilization:
  garrison_min_pct: 0.15
  campaign_max_pct: 0.70

march:
  speed_plains: 3
  speed_hills: 2
  speed_mountain: 1
  speed_forest: 2
  speed_river: 1
  speed_coast: 3

naval:
  # Naval-specific rules (unique to this scenario)
  blockade_effectiveness: 0.5     # 50% reduction in trade income for blockaded port
  amphibious_assault_penalty: 0.7 # Attacker power reduced to 70% in amphibious
  fleet_capacity_per_port: 5000   # Max naval troops per coastal territory
  taiwan_retreat:
    available: true
    description: "郑氏可退守台湾，建立海上根据地"
