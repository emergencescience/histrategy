# ============================================================
# Conditional Historical Events — Southern Ming 1645-1662
#
# Events are injected into NPC LLM context ONLY when:
#   1. The current year/season matches the trigger window
#   2. The preconditions are still met (event is still possible)
#   3. The player has NOT taken actions that cancel this event
# ============================================================

events:
  # ─── 1645 CE ───────────────────────────────────────────
  - id: qing_southward_invasion
    title: "清军南下征明 (Qing army invades south)"
    year_range: [1645, 1645]
    season: spring
    preconditions:
      - faction_exists: qing
      - faction_alive: qing
      - faction_exists: nanming
    cancel_if:
      - faction_dead: nanming
      - territory_owned: [qing, nanjing]
    context_for_npc: |
      多尔衮已命多铎为定国大将军，率八旗精锐南下。清军兵分两路：
      一路出山东指向徐州，一路出河南指向襄阳。南明江北四镇各有算盘，
      史可法虽坐镇扬州但无法统一指挥。此为存亡之秋。
    context_for_npc_en: |
      Dorgon has appointed Dodo as Grand General Pacifying the South, leading the
      Eight Banners elite. Two-pronged attack: one through Shandong toward Xuzhou,
      one through Henan toward Xiangyang. The four northern garrisons of Southern Ming
      each have their own agenda — Shi Kefa holds Yangzhou but cannot command them all.

  - id: nanming_internal_power_struggle
    title: "南明党争 (Southern Ming court factionalism)"
    year_range: [1645, 1646]
    season: any
    preconditions:
      - faction_exists: nanming
      - faction_alive: nanming
      - faction_stat_lt: [nanming, morale_actual, 70]
    cancel_if:
      - faction_dead: nanming
      - faction_stat_gte: [nanming, morale_actual, 80]
    context_for_npc: |
      弘光朝廷内部马士英、阮大铖与东林党人水火不容。史可法虽忠但被排挤出京，
      督师扬州实为流放。朝堂内斗严重削弱了南明的决策能力。
      若不能迅速统一内部，清军南下时将无法组织有效抵抗。
    context_for_npc_en: |
      Ma Shiying and Ruan Dacheng are locked in bitter conflict with the Donglin faction
      at the Hongguang court. Shi Kefa, though loyal, has been sidelined to Yangzhou.
      This internal strife cripples Southern Ming decision-making.
      Without rapid internal unity, there will be no coordinated defense against the Qing.

  - id: peasant_army_dilemma
    title: "农民军的两难 (Peasant army's dilemma)"
    year_range: [1645, 1647]
    season: any
    preconditions:
      - faction_exists: nongminjun
      - faction_alive: nongminjun
    cancel_if:
      - faction_dead: nongminjun
      - faction_allied: [nongminjun, nanming]
    context_for_npc: |
      李自成在北京被清军击败后元气大伤，退守襄阳。张献忠在四川独树一帜。
      农民军现在面临选择：联明抗清（但南明视其为弑君仇敌），或各自为战
      （但会被清军各个击破）。已有部分农民军将领考虑投降清朝换取封赏。
    context_for_npc_en: |
      Li Zicheng's forces are battered after being driven from Beijing by the Qing,
      now holding only Xiangyang. Zhang Xianzhong operates independently in Sichuan.
      The peasant armies face a choice: ally with Southern Ming against the Qing
      (but Ming sees them as regicides), or fight alone (and be destroyed piecemeal).
      Some peasant generals already consider defecting to the Qing for rewards.

  - id: zheng_maritime_calculus
    title: "郑氏的海上算盘 (Zheng clan maritime calculus)"
    year_range: [1645, 1650]
    season: any
    preconditions:
      - faction_exists: zheng
      - faction_alive: zheng
    cancel_if:
      - faction_dead: zheng
    context_for_npc: |
      郑氏海商集团控制着东亚最重要的贸易网络——从日本到马六甲的利润
      远超任何内陆税收。郑芝龙倾向于与强者合作（曾与荷兰人、明朝、
      清朝都打过交道），而年轻的郑成功更倾向效忠明朝。
      郑氏的选择将决定东南沿海的归属：继续观望，扶持南明，还是投靠清朝？
    context_for_npc_en: |
      The Zheng maritime network controls East Asia's most valuable trade routes,
      from Japan to Malacca — profits far exceeding any inland taxation.
      Zheng Zhilong is pragmatic (has dealt with Dutch, Ming, and Qing),
      while young Zheng Chenggong leans toward Ming loyalism.
      The Zheng choice determines the southeast coast: observe, back the Ming, or join Qing?

  # ─── 1645-1646 CE ──────────────────────────────────────
  - id: yangzhou_siege
    title: "扬州之围 (Siege of Yangzhou)"
    year_range: [1645, 1645]
    season: summer
    preconditions:
      - faction_exists: nanming
      - faction_alive: nanming
      - territory_owned: [nanming, nanjing]
      - character_exists: shikefa
    cancel_if:
      - territory_owned: [qing, nanjing]
      - character_dead: shikefa
    context_for_npc: |
      清军兵临扬州城下。史可法率扬州军民死守，但江北四镇援军迟迟不至。
      扬州若破，长江防线将门户洞开——南京危在旦夕。
      历史上扬州城破后清军屠城十日，史称"扬州十日"。
    context_for_npc_en: |
      Qing forces have reached the walls of Yangzhou. Shi Kefa defends with
      the city militia, but reinforcements from the four northern garrisons
      have not arrived. If Yangzhou falls, the Yangtze defense line collapses —
      Nanjing is directly threatened. Historically, the city's fall was followed
      by the ten-day Yangzhou Massacre.

  - id: longwu_opportunity
    title: "隆武继位之机 (Longwu succession opportunity)"
    year_range: [1645, 1646]
    season: winter
    preconditions:
      - faction_exists: nanming
      - faction_alive: nanming
    cancel_if:
      - faction_dead: nanming
    context_for_npc: |
      南京若失，南明朝廷需要一个新皇帝。唐王朱聿键在福建得到郑氏支持，
      是最有希望的人选。但鲁王朱以海在浙江也称监国，两个朝廷可能互相消耗。
      若能统合诸王、共奉一帝，南明尚有一战之力。
    context_for_npc_en: |
      If Nanjing falls, Southern Ming needs a new emperor. Zhu Yujian (Prince of Tang)
      has Zheng clan support in Fujian — the strongest candidate. But Zhu Yihai
      (Prince of Lu) also claims regency in Zhejiang. Two courts will weaken each other.
      If the princes can unite behind one emperor, Southern Ming can still fight.

  # ─── 1646-1647 CE ──────────────────────────────────────
  - id: zhangxianzhong_under_pressure
    title: "张献忠四面楚歌 (Zhang Xianzhong surrounded)"
    year_range: [1646, 1647]
    season: any
    preconditions:
      - faction_exists: nongminjun
      - character_exists: zhangxianzhong
      - territory_owned: [nongminjun, sichuan]
    cancel_if:
      - character_dead: zhangxianzhong
    context_for_npc: |
      张献忠在四川的统治日益不稳。蜀人对大西政权的严刑峻法怨声载道，
      清军已从陕西南下逼近川北。若张献忠败亡，其部将李定国、孙可望
      可能率余部投奔南明，成为抗清主力——但这需要南明愿意接纳昔日的敌人。
    context_for_npc_en: |
      Zhang Xianzhong's grip on Sichuan weakens. The population resents his harsh rule.
      Qing forces advance from Shaanxi toward northern Sichuan. If Zhang falls,
      his generals Li Dingguo and Sun Kewang may lead remnants to join Southern Ming —
      becoming the main anti-Qing force. But this requires Ming to accept former enemies.
