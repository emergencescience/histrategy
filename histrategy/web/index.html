<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三國志略 — Histrategy v2</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--bg-panel:#16213e;--bg-input:#0f3460;
  --text:#e0d8c8;--text-dim:#8a8a7a;--text-bright:#f5e6c8;
  --gold:#d4a017;--red:#c0392b;--blue:#2980b9;--green:#27ae60;
  --border:#2a2a4a;--accent:#e74c3c;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',
    'Noto Sans SC','Microsoft YaHei',sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}

/* Header */
header{
  background:linear-gradient(180deg,#2c1810,#16213e);
  border-bottom:2px solid #3a2020;padding:10px 24px;
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
header h1{font-size:1.3em;color:var(--gold);letter-spacing:3px}
.stats{display:flex;gap:20px;align-items:center;font-size:.85em}
.stat{text-align:center}
.stat label{color:var(--text-dim);font-size:.7em;display:block;text-transform:uppercase}
.stat span{color:var(--text-bright);font-weight:bold}
.stat .s{color:#5dade2}.stat .f{color:#f0c27a}.stat .g{color:var(--gold)}
#stat-territories{color:#58d68d;font-size:.8em}

/* Main */
main{display:flex;flex:1;min-height:0}
.map-panel{flex:1.2;position:relative;background:var(--bg);
  border-right:1px solid var(--border);min-width:450px}
.info-panel{flex:0.8;display:flex;flex-direction:column;overflow-y:auto;
  padding:16px 20px;gap:12px;min-width:320px;max-width:480px}

/* Map */
.map-panel svg{width:100%;height:100%}
.city{cursor:pointer;transition:filter .2s}
.city:hover{filter:brightness(1.6)}
.city.player{stroke:var(--gold);stroke-width:2.5;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}
.city-label{font-size:11px;pointer-events:none;text-anchor:middle;
  fill:var(--text-dim)}
.city-label.player{fill:var(--gold);font-size:12px;font-weight:bold}

/* Panels */
.panel{
  background:var(--bg-panel);border:1px solid var(--border);
  border-radius:6px;padding:14px 16px;flex-shrink:0}
.panel-title{
  color:var(--gold);font-size:.8em;letter-spacing:1px;
  margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px}
.narrative{font-size:.9em;line-height:1.7;white-space:pre-wrap;
  max-height:220px;overflow-y:auto}
.narrative h3,.narrative strong{color:var(--gold)}
.suggestions{list-style:none;display:flex;flex-direction:column;gap:5px}
.sug-item{
  background:var(--bg-input);border:1px solid var(--border);
  border-radius:4px;padding:9px 12px;cursor:pointer;transition:all .15s;font-size:.88em}
.sug-item:hover{background:#1a3a5c;border-color:var(--accent)}
.sug-item .tag{background:var(--accent);color:#fff;font-size:.7em;
  padding:1px 6px;border-radius:3px;margin-right:6px;white-space:nowrap}

/* Input */
.input-row{display:flex;gap:8px;flex-shrink:0}
#decision-input{
  flex:1;background:var(--bg-input);border:1px solid var(--border);
  border-radius:4px;padding:10px 14px;color:var(--text-bright);
  font-size:.95em;font-family:inherit;outline:none}
#decision-input:focus{border-color:var(--accent)}
#decision-input::placeholder{color:var(--text-dim)}
.btn{
  background:var(--accent);color:#fff;border:none;border-radius:4px;
  padding:10px 24px;cursor:pointer;font-size:.9em;font-weight:600}
.btn:hover{background:#c0392b}
.btn:disabled{background:#555;cursor:not-allowed}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.8);
  display:flex;align-items:center;justify-content:center;z-index:100}
.modal{
  background:var(--bg-panel);border:1px solid var(--gold);border-radius:8px;
  padding:32px 28px;max-width:500px;text-align:center}
.modal h2{color:var(--gold);margin-bottom:8px;font-size:1.3em}
.modal .sub{color:var(--text-dim);font-size:.85em;margin-bottom:20px}
.faction-choices{display:flex;gap:12px;justify-content:center}
.faction-btn{
  background:var(--bg-input);border:2px solid var(--border);border-radius:6px;
  padding:18px 18px;cursor:pointer;transition:all .2s;text-align:center;
  min-width:120px;color:var(--text);font-family:inherit}
.faction-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.faction-btn .n{font-size:1.2em;font-weight:bold;display:block;margin-bottom:6px}
.faction-btn .d{font-size:.75em;color:var(--text-dim);line-height:1.4}

/* Status bar */
.status-bar{
  display:flex;gap:12px;align-items:center;justify-content:center;
  padding:6px;background:rgba(22,33,62,.8);border-radius:4px;
  font-size:.8em;flex-shrink:0}
.status-bar .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}

.loading{text-align:center;color:var(--text-dim);padding:30px;font-size:.9em}
.error{color:var(--accent);font-size:.85em;padding:6px;background:rgba(231,76,60,.1);
  border-radius:4px}
.hidden{display:none!important}
footer{text-align:center;color:var(--text-dim);font-size:.7em;
  padding:6px;flex-shrink:0;border-top:1px solid var(--border)}
</style>
</head>
<body>

<!-- Faction Modal -->
<div class="modal-overlay" id="faction-modal">
  <div class="modal">
    <h2>🏯 选择君主</h2>
    <p class="sub">建安十二年（公元207年），天下三分之势未定…</p>
    <div class="faction-choices">
      <button class="faction-btn" data-faction="shu">
        <span class="n">🔴 刘备</span>
        <span class="d">寄居新野<br>三顾茅庐在即</span>
      </button>
      <button class="faction-btn" data-faction="cao">
        <span class="n">🔵 曹操</span>
        <span class="d">奉天子令不臣<br>已据中原大半</span>
      </button>
      <button class="faction-btn" data-faction="wu">
        <span class="n">🟢 孙权</span>
        <span class="d">继承父兄基业<br>稳坐江东</span>
      </button>
    </div>
  </div>
</div>

<!-- Header -->
<header>
  <h1>三國志略<span style="color:var(--text-dim);font-size:.6em;margin-left:6px">v2</span></h1>
  <div class="stats">
    <div class="stat"><label>年代</label><span id="stat-year">—</span></div>
    <div class="stat"><label>兵力</label><span class="s" id="stat-strength">—</span></div>
    <div class="stat"><label>粮草</label><span class="f" id="stat-food">—</span></div>
    <div class="stat"><label>资金</label><span class="g" id="stat-treasury">—</span></div>
    <div class="stat"><label>民心</label><span id="stat-morale">—</span></div>
    <span id="stat-territories"></span>
  </div>
</header>

<!-- Main -->
<main>
  <div class="map-panel">
    <svg viewBox="0 0 800 600" id="map-svg">
      <rect width="800" height="600" fill="#1a1a2e"/>
      <g stroke="#222244" stroke-width="0.5" opacity="0.3">
        <line x1="200" y1="0" x2="200" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
        <line x1="600" y1="0" x2="600" y2="600"/><line x1="0" y1="200" x2="800" y2="200"/>
        <line x1="0" y1="400" x2="800" y2="400"/>
      </g>
      <g stroke="#2a4a6a" stroke-width="3" fill="none" opacity="0.4">
        <path d="M0,120 Q200,110 350,140 Q500,160 650,120 Q750,100 800,90"/>
        <path d="M0,350 Q200,330 400,370 Q550,390 650,350 Q750,330 800,340"/>
      </g>
      <g id="cities-layer"></g>
    </svg>
  </div>

  <div class="info-panel">
    <!-- Status bar -->
    <div class="status-bar">
      <span class="dot"></span>
      <span id="turn-info" style="color:var(--text-dim)">等待选择势力…</span>
    </div>

    <!-- Narrative -->
    <div class="panel">
      <div class="panel-title">📜 军师来报</div>
      <div class="narrative" id="narrative-text">请先在上方选择你要辅佐的君主。</div>
    </div>

    <!-- Suggestions -->
    <div class="panel">
      <div class="panel-title">🎯 廷议决策方向</div>
      <ul class="suggestions" id="suggestions-list"></ul>
    </div>

    <!-- Input -->
    <div class="input-row">
      <input type="text" id="decision-input" placeholder="下达你的战略命令…" disabled autocomplete="off">
      <button class="btn" id="submit-btn" disabled>执行</button>
    </div>

    <!-- Error display -->
    <div id="error-msg" class="error hidden"></div>
  </div>
</main>

<footer>三國志略 v2 · Emergence Science · 207 三顾茅庐</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════════ */
const API = '/api';
let gameId = null, isProcessing = false;

const $ = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════════════════
   City Data (207 CE, Chinese names)
   ═══════════════════════════════════════════════════════════════ */
const CITIES = [
  {id:'beiping',  name:'北平',   x:690, y:55,  faction:'gongsunzan'},
  {id:'jixian',   name:'蓟县',   x:650, y:100, faction:'gongsunzan'},
  {id:'jinyang',  name:'晋阳',   x:480, y:115, faction:'cao'},
  {id:'yecheng',  name:'邺城',   x:560, y:160, faction:'cao'},
  {id:'beihai',   name:'北海',   x:720, y:190, faction:'cao'},
  {id:'luoyang',  name:'洛阳',   x:450, y:225, faction:'cao'},
  {id:'xuchang',  name:'许昌',   x:500, y:275, faction:'cao'},
  {id:'runan',    name:'汝南',   x:555, y:310, faction:'cao'},
  {id:'xiapi',    name:'下邳',   x:670, y:260, faction:'cao'},
  {id:'changan',  name:'长安',   x:350, y:215, faction:'cao'},
  {id:'hanshong', name:'汉中',   x:320, y:290, faction:'zhanglu'},
  {id:'tianshui', name:'天水',   x:280, y:195, faction:'machao'},
  {id:'wuwei',    name:'武威',   x:220, y:155, faction:'machao'},
  {id:'xinye',    name:'新野',   x:480, y:345, faction:'shu'},
  {id:'xiangyang',name:'襄阳',   x:440, y:365, faction:'liubiao'},
  {id:'jiangling',name:'江陵',   x:415, y:405, faction:'liubiao'},
  {id:'jiangxia', name:'江夏',   x:520, y:385, faction:'liubiao'},
  {id:'changsha', name:'长沙',   x:460, y:465, faction:'wu'},
  {id:'jianye',   name:'建业',   x:650, y:395, faction:'wu'},
  {id:'lujiang',  name:'庐江',   x:585, y:375, faction:'wu'},
  {id:'wujun',    name:'吴郡',   x:695, y:415, faction:'wu'},
  {id:'kuaiji',   name:'会稽',   x:735, y:445, faction:'wu'},
  {id:'chengdu',  name:'成都',   x:170, y:375, faction:'liuzhang'},
  {id:'jiangzhou',name:'江州',   x:270, y:385, faction:'liuzhang'},
  {id:'nanhai',   name:'南海',   x:540, y:530, faction:'wu'},
];

const FACTION_COLORS = {
  shu:'#e74c3c', cao:'#2980b9', wu:'#27ae60',
  gongsunzan:'#7f8c8d', liubiao:'#95a5a6', liuzhang:'#bdc3c7',
  machao:'#8e44ad', zhanglu:'#d35400',
};

const FACTION_FULL = {shu:'刘备',cao:'曹操',wu:'孙权'};

/* ═══════════════════════════════════════════════════════════════
   API
   ═══════════════════════════════════════════════════════════════ */
async function api(method, path, body=null) {
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  const resp = await fetch(API+path, opts);
  if(!resp.ok){
    const txt = await resp.text();
    throw new Error(`HTTP ${resp.status}: ${txt.substring(0,200)}`);
  }
  return resp.json();
}

/* ═══════════════════════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════════════════════ */
function renderMap(territoryIds, playerFaction) {
  const layer = $('cities-layer');
  const tSet = new Set(territoryIds || []);
  let html = '';
  CITIES.forEach(c => {
    const mine = tSet.has(c.id) || (playerFaction && c.faction === playerFaction);
    const color = mine ? '#d4a017' : (FACTION_COLORS[c.faction] || '#555');
    const cls = mine ? 'city player' : 'city';
    const r = mine ? 8 : 5;
    html += `<circle cx="${c.x}" cy="${c.y}" r="${r}" fill="${color}"
      class="${cls}" data-city="${c.id}"><title>${c.name}</title></circle>
      <text x="${c.x}" y="${c.y-10}" class="city-label${mine?' player':''}">${c.name}</text>`;
  });
  layer.innerHTML = html;
}

function updateStats(status) {
  if(!status) return;
  $('stat-year').textContent = `${status.year||'?'}年${status.season||'?'}`;
  $('stat-strength').textContent = (status.strength||0).toLocaleString();
  $('stat-food').textContent = (status.food||0).toLocaleString();
  $('stat-treasury').textContent = (status.treasury||0).toLocaleString();
  $('stat-morale').textContent = status.morale||'?';

  const names = status.territory_names || status.territories || [];
  $('stat-territories').textContent = names.length ? `🏰 ${names.join(' · ')}` : '';
  $('turn-info').textContent = status.name
    ? `${status.name} · 第${status.turn||1}回合`
    : '等待选择势力…';
}

function renderNarrative(text) {
  $('narrative-text').innerHTML = (text || '—')
    .replace(/\n/g, '<br>')
    .replace(/### (.+)/g, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function renderSuggestions(list) {
  const ul = $('suggestions-list');
  ul.innerHTML = '';
  (list||[]).forEach(s => {
    const li = document.createElement('li');
    li.className = 'sug-item';
    const m = s.match(/^【(.+?)】\s*(.*)/);
    li.innerHTML = m
      ? `<span class="tag">${m[1]}</span>${m[2]}`
      : s;
    li.onclick = () => {
      $('decision-input').value = s;
      $('submit-btn').disabled = false;
    };
    ul.appendChild(li);
  });
}

function showError(msg) {
  const el = $('error-msg');
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 6000);
}

/* ═══════════════════════════════════════════════════════════════
   Game Flow
   ═══════════════════════════════════════════════════════════════ */
async function startGame(faction) {
  $('faction-modal').classList.add('hidden');
  $('narrative-text').textContent = '天机运转，调遣兵马…';
  $('turn-info').textContent = '创建游戏中…';

  try {
    // Create game
    const data = await api('POST','/games',{faction,scenario:'207',new:true});
    gameId = data.game_id;

    renderMap(data.faction_status?.territories, faction);
    updateStats(data.faction_status);
    renderNarrative(data.intro?.narrative || '初平元年，汉室倾颓，群雄逐鹿。');
    $('decision-input').disabled = false;

    // Fetch plan
    await fetchPlan();
  } catch(e) {
    renderNarrative(`⚠️ 游戏启动失败：${e.message}`);
    showError(`API错误：${e.message}。请确认服务器是否正常运行。`);
  }
}

async function fetchPlan() {
  if(!gameId) return;
  try {
    const data = await api('POST',`/games/${gameId}/plan`);
    renderNarrative(data.court_dialogue);
    renderSuggestions(data.suggestions);
    updateStats(data.faction_status);
    renderMap(data.faction_status?.territories, data.faction_status?.faction_id);
  } catch(e) {
    showError(`Plan获取失败：${e.message}`);
  }
}

async function submitDecision() {
  if(isProcessing || !gameId) return;
  const decision = $('decision-input').value.trim();
  if(!decision) return;

  isProcessing = true;
  $('submit-btn').disabled = true;
  $('submit-btn').textContent = '推演中…';
  $('narrative-text').textContent = '天机运转，推演天下大势…';

  try {
    const data = await api('POST',`/games/${gameId}/command`,{decision});
    renderNarrative(data.aftermath || data.narrative);
    renderSuggestions(data.new_suggestions || []);
    renderMap(data.faction_status?.territories, data.faction_status?.faction_id);
    updateStats(data.faction_status);

    if(data.game_over){
      renderNarrative((data.game_over.message||'游戏结束') + '\n\n' + (data.aftermath||''));
      $('decision-input').disabled = true;
      $('submit-btn').disabled = true;
      $('submit-btn').textContent = '终局';
    }
  } catch(e) {
    renderNarrative(`⚠️ 回合处理失败：${e.message}`);
    showError(e.message);
  } finally {
    isProcessing = false;
    $('submit-btn').textContent = '执行';
    $('submit-btn').disabled = false;
    $('decision-input').value = '';
    $('decision-input').focus();
  }
}

/* ═══════════════════════════════════════════════════════════════
   Event Listeners
   ═══════════════════════════════════════════════════════════════ */
document.querySelectorAll('.faction-btn').forEach(btn => {
  btn.addEventListener('click', () => startGame(btn.dataset.faction));
});

$('submit-btn').addEventListener('click', submitDecision);
$('decision-input').addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault();submitDecision();}
  $('submit-btn').disabled = !$('decision-input').value.trim();
});
$('decision-input').addEventListener('input', () => {
  $('submit-btn').disabled = !$('decision-input').value.trim();
});

// Click narrative to re-fetch plan
$('narrative-text').addEventListener('dblclick', fetchPlan);

/* ═══════════════════════════════════════════════════════════════
   Init — draw empty map, show faction modal
   ═══════════════════════════════════════════════════════════════ */
renderMap([], null);
$('faction-modal').classList.remove('hidden');
</script>
</body>
</html>
