<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三國志略 — Histrategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<header>
  <h1><img src="/images/histrategy-logo-scroll.svg" alt="三國志略" class="logo-img">三國志略 <span>Histrategy</span></h1>
  <div class="stats">
    <div class="stat"><label>年份</label><span id="stat-year">207</span></div>
    <div class="stat"><label>季节</label><span id="stat-season">春</span></div>
    <div class="stat"><label>资金</label><span class="g" id="stat-gold">0</span></div>
    <div class="stat"><label>粮草</label><span class="f" id="stat-food">0</span></div>
    <div class="stat"><label>民心</label><span id="stat-morale">0</span></div>
    <div class="stat"><label>兵力</label><span class="s" id="stat-strength">0</span></div>
    <div class="stat"><label>回合</label><span id="stat-turn">1</span></div>
    <div class="llm-badge llm-off" id="llm-badge">AI OFF</div>
  </div>
  <span id="stat-lands" style="font-size:.65em;max-width:160px"></span>
</header>

<main id="main-content">
  <!-- Dynamically populated -->
</main>

<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/game.js"></script>

</body>
</html>
