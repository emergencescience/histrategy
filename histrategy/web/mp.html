<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histrategy · Multiplayer</title>
<style>
:root {
  --bg: #1a1a2e; --panel: #16213e; --border: #0f3460;
  --gold: #d4a574; --text: #e0d6c2; --muted: #8a8a8a;
  --btn: #0f3460; --btn-hover: #1a5276;
  /* Default faction colours — overridden dynamically */
  --f0: #4a90d9; --f1: #5cb85c; --f2: #d9534f; --f3: #f0ad4e;
  --f4: #8e44ad; --f5: #1abc9c; --f6: #e74c3c; --f7: #3498db;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:"Noto Serif SC","SimSun",serif; min-height:100vh; }
.mp-header { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px 0; }
.mp-logo { height: 36px; width: auto; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4)); transition: transform 0.3s ease; }
.mp-logo:hover { transform: scale(1.1) rotate(2deg); }
h1 { font-size:1.4em; color:var(--gold); }
h2 { font-size:1.1em; color:var(--gold); margin:12px 0 8px; }
.container { max-width:800px; margin:0 auto; padding:16px; }
.panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
input, textarea, button { font-family:inherit; font-size:0.95em; }
input, textarea, select { width:100%; padding:10px; background:#1a1a2e; border:1px solid var(--border); color:var(--text); border-radius:6px; margin:6px 0; }
textarea { resize:vertical; min-height:60px; }
select { cursor:pointer; }
.btn { display:inline-block; padding:10px 20px; background:var(--btn); color:var(--gold); border:1px solid var(--border); border-radius:6px; cursor:pointer; margin:4px; }
.btn:hover { background:var(--btn-hover); }
.btn.primary { background:#2d6a4f; font-size:1.05em; }
.btn:disabled { opacity:0.4; cursor:not-allowed; }

.faction-toggle { display:inline-block; padding:10px 20px; margin:4px; border-radius:6px; cursor:pointer;
  background:transparent; font-size:0.95em; border:2px solid var(--border); color:var(--muted);
  transition:all 0.2s; }
.faction-toggle.on { color:#fff; }
.faction-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.85em; margin:0 4px; color:#fff; }

.player-link { display:block; padding:8px 12px; margin:6px 0; background:rgba(255,255,255,0.05); border-radius:6px;
  border-left:3px solid var(--gold); }
.player-link code { color:var(--gold); font-size:0.9em; word-break:break-all; }
.player-link .copy-btn { float:right; background:var(--btn); color:var(--text); border:none; padding:4px 10px;
  border-radius:4px; cursor:pointer; font-size:0.8em; }

.narrative-box { max-height:400px; overflow-y:auto; padding:12px; background:rgba(0,0,0,0.2); border-radius:6px; line-height:1.7; }
#status-bar { text-align:center; padding:8px; font-size:0.9em; color:var(--muted); }
.ready { color:#5cb85c; }
.waiting { color:#d4a574; }
.hidden { display:none; }

.turn-block { margin-bottom: 12px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 6px; border-left: 3px solid var(--border); }
.turn-header { font-size: 0.85em; color: var(--gold); margin-bottom: 6px; font-weight: bold; }
.turn-narrative { line-height: 1.7; margin-bottom: 6px; }
.turn-npc { font-size: 0.85em; color: var(--muted); margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="container">
<div class="mp-header">
  <img src="/images/histrategy-logo-scroll.svg" alt="Histrategy" class="mp-logo">
  <h1 id="page-title">Histrategy · Multiplayer</h1>
</div>
<div id="top-bar"></div>

<!-- Screen 1: Create or Join -->
<div id="home-panel" class="panel">
  <h2>🏯 开始游戏</h2>

  <!-- Scenario picker -->
  <div style="margin-bottom:12px">
    <label style="color:var(--gold); font-size:0.9em">场景:</label>
    <select id="scenario-select" onchange="onScenarioChange()" style="width:auto; min-width:200px"></select>
  </div>

  <!-- Create Room -->
  <h3>▸ 创建房间（房主）</h3>
  <p style="font-size:0.85em; color:var(--muted)">选择由人类控制的势力：</p>
  <div id="create-faction-toggles" style="margin:8px 0"></div>
  <button class="btn primary" onclick="doCreateRoom()">创建房间</button>

  <!-- Join Room -->
  <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--border)">
    <h3>▸ 加入房间（玩家）</h3>
    <p style="font-size:0.85em; color:var(--muted)">粘贴房主分享的链接，或手动输入房间号和势力：</p>
    <input id="join-room-id" placeholder="房间 ID（从链接中复制）">
    <div style="display:flex; gap:8px; margin-top:8px">
      <select id="join-faction" style="flex:1"><option value="">加载中...</option></select>
      <button class="btn primary" onclick="doJoinRoom()">进入</button>
    </div>
  </div>
</div>

<!-- Screen 2: Room created -->
<div id="room-created-panel" class="panel hidden">
  <h2>✅ 游戏已开始</h2>
  <p style="color:var(--muted); margin-bottom:12px">AI NPC 已在运筹帷幄。把下面的链接发给其他玩家：</p>
  <div id="player-links"></div>
  <p style="color:var(--gold); text-align:center; margin-top:12px; font-size:0.9em">⚔ 玩家通过链接进入后即可传令，全员传令后自动推演下一季度</p>
</div>

<!-- Screen 3: Game -->
<div id="game-panel" class="panel hidden">
  <div style="display:flex; justify-content:space-between; align-items:center">
    <div id="status-bar">⏳ 等待...</div>
    <button class="btn" onclick="refreshGame()" style="font-size:0.85em">🔄 刷新</button>
  </div>
  <h2>📜 局势推演</h2>
  <div id="narrative" class="narrative-box"></div>
  <div id="npc-actions" style="margin-top:8px"></div>
  <div style="margin-top:12px">
    <textarea id="decision-input" rows="3" placeholder="输入你的决策..."></textarea>
    <button class="btn primary" id="submit-btn" onclick="doDecide()">传令</button>
  </div>
</div>
</div>

<script>
// ── State ──────────────────────
const API = new URLSearchParams(location.search).get('api_prefix') || '';
let roomId = '';
let myUserId = 'u_' + Math.random().toString(36).slice(2,10);
let myFaction = '';
let myRole = '';
let pollTimer = null;
let scenarios = [];         // from /api/scenarios
let currentScenario = null; // selected scenario object

// ── Utils ──────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  return r.json();
}
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function el(id) { return document.getElementById(id); }

// ── Colour helpers ─────────────
const PALETTE = ['#4a90d9','#5cb85c','#d9534f','#f0ad4e','#8e44ad','#1abc9c','#e74c3c','#3498db'];
function factionColor(idx) { return PALETTE[idx % PALETTE.length]; }

// ── Year formatting ────────────
function fmtYear(y, epoch) {
  if (epoch === 'BC' || epoch === 'BCE' || y < 0) {
    const absY = Math.abs(y < 0 ? y : y);
    return `公元前${absY}年`;
  }
  return `${y || 207}年`;
}

// ── Init ───────────────────────
(async function init() {
  // Fetch scenario list
  const r = await api('GET', '/api/scenarios');
  if (r.ok && r.scenarios) {
    scenarios = r.scenarios;
  } else {
    // Fallback: hardcoded Three Kingdoms
    scenarios = [{id:'three-kingdoms', name_cn:'三國志略', start_year:207, epoch:'', factions:[
      {id:'caocao', name_cn:'曹操军(魏)', color:'#4a90d9'},
      {id:'liubei', name_cn:'刘备军(蜀)', color:'#5cb85c'},
      {id:'sunquan', name_cn:'孙权军(吴)', color:'#d9534f'}
    ]}];
  }

  // Determine scenario from URL or default
  const urlParams = new URLSearchParams(location.search);
  const scenFromURL = urlParams.get('scenario') || 'three-kingdoms';

  // Populate scenario dropdown
  const sel = el('scenario-select');
  scenarios.forEach((s, i) => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.name_cn || s.name || s.id;
    if (s.id === scenFromURL) opt.selected = true;
    sel.appendChild(opt);
  });

  // Load initial scenario
  selectScenario(scenFromURL);

  // Auto-join if URL has room + faction
  const { room, faction } = parseURL();
  if (room && faction) {
    el('join-room-id').value = room;
    el('join-faction').value = faction;
    doJoinRoom();
  }
})();

function selectScenario(sid) {
  currentScenario = scenarios.find(s => s.id === sid) || scenarios[0];
  if (!currentScenario) return;

  // Update page title
  const name = currentScenario.name_cn || currentScenario.name || sid;
  const period = currentScenario.period || '';
  el('page-title').textContent = period ? `${name} · ${period}` : `${name} · Multiplayer`;

  // Render faction toggles
  renderFactionToggles();

  // Update join faction dropdown
  renderJoinDropdown();
}

function onScenarioChange() {
  selectScenario(el('scenario-select').value);
}

function renderFactionToggles() {
  const div = el('create-faction-toggles');
  div.innerHTML = '';
  const factions = currentScenario.factions || [];
  // Only show playable factions for human selection
  const playable = factions.filter(f => f.playable !== false);
  if (playable.length === 0) {
    div.innerHTML = '<span style="color:var(--muted)">无可用势力</span>';
    return;
  }
  playable.forEach((f, i) => {
    const color = f.color || factionColor(i);
    const btn = document.createElement('span');
    btn.className = 'faction-toggle';  // default: OFF
    btn.style.borderColor = color;
    btn.style.color = 'var(--muted)';
    btn.textContent = f.name_cn || f.name || f.id;
    btn.dataset.fid = f.id;
    btn.dataset.color = color;
    btn.onclick = function() {
      this.classList.toggle('on');
      if (this.classList.contains('on')) {
        this.style.background = color;
        this.style.color = '#fff';
      } else {
        this.style.background = 'transparent';
        this.style.color = 'var(--muted)';
      }
    };
    div.appendChild(btn);
  });
}

function renderJoinDropdown() {
  const sel = el('join-faction');
  sel.innerHTML = '';
  const factions = currentScenario.factions || [];
  factions.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.id;
    opt.textContent = f.name_cn || f.name || f.id;
    sel.appendChild(opt);
  });
  if (factions.length === 0) {
    sel.innerHTML = '<option value="">无可用势力</option>';
  }
}

// Read room, faction from URL
function parseURL() {
  const p = new URLSearchParams(location.search);
  return { room: p.get('room') || '', faction: p.get('faction') || '' };
}

// ── Create Room ─────────────────
async function doCreateRoom() {
  const toggles = document.querySelectorAll('.faction-toggle.on');
  const humanFactions = Array.from(toggles).map(t => t.dataset.fid);
  if (humanFactions.length < 1) { alert('至少选择一个人类势力'); return; }

  const r = await api('POST', '/api/rooms', {
    user_id: myUserId,
    human_faction_ids: humanFactions,
    scenario: currentScenario.id,
  });
  if (!r.ok) { alert(r.error || '创建失败'); return; }

  roomId = r.room_id;
  myRole = 'host';

  hide('home-panel');
  show('room-created-panel');
  el('top-bar').innerHTML = `房间: <b style="color:var(--gold)">${roomId}</b> · 已开始`;

  // Build faction colour map
  const factionColors = {};
  const factionNames = {};
  (currentScenario.factions || []).forEach((f, i) => {
    factionColors[f.id] = f.color || factionColor(i);
    factionNames[f.id] = f.name_cn || f.name || f.id;
  });

  const linksDiv = el('player-links');
  linksDiv.innerHTML = '';

  const playerLinks = r.player_links || [];
  if (playerLinks.length > 0) {
    playerLinks.forEach(link => {
      const fid = link.faction;
      const color = factionColors[fid] || factionColor(0);
      const div = document.createElement('div');
      div.className = 'player-link';
      div.innerHTML = `
        <span class="faction-badge" style="background:${color}">${factionNames[fid] || fid} — ${link.player_name || ''}</span>
        <code>${link.url}</code>
        <button class="copy-btn" onclick="copyLink(this, '${link.url}')">复制链接</button>`;
      linksDiv.appendChild(div);
    });
  } else {
    humanFactions.forEach(fid => {
      const color = factionColors[fid] || factionColor(0);
      const url = `${location.origin}/mp?scenario=${currentScenario.id}&room=${roomId}&faction=${fid}`;
      const div = document.createElement('div');
      div.className = 'player-link';
      div.innerHTML = `
        <span class="faction-badge" style="background:${color}">${factionNames[fid] || fid}</span>
        <code>${url}</code>
        <button class="copy-btn" onclick="copyLink(this, '${url}')">复制链接</button>`;
      linksDiv.appendChild(div);
    });
  }
}

// ── Join Room ───────────────────
async function doJoinRoom() {
  const rid = el('join-room-id').value.trim();
  const fid = el('join-faction').value;
  if (!rid) { alert('请输入房间 ID'); return; }

  const body = { user_id: myUserId, faction: fid };
  const r = await api('POST', `/api/rooms/${rid}/enter`, body);
  if (!r.ok) { alert(r.error); return; }

  roomId = rid;
  myFaction = fid;
  myRole = r.role || 'player';
  myUserId = r.user_id || myUserId;

  hide('home-panel');
  hide('room-created-panel');

  // Build faction colour map
  const factionColors = {};
  const factionNames = {};
  (currentScenario.factions || []).forEach((f, i) => {
    factionColors[f.id] = f.color || factionColor(i);
    factionNames[f.id] = f.name_cn || f.name || f.id;
  });
  const badge = factionNames[fid] || fid;
  const color = factionColors[fid] || factionColor(0);
  el('top-bar').innerHTML = `房间: <b style="color:var(--gold)">${roomId}</b> · 势力: <span class="faction-badge" style="background:${color}">${badge}</span>`;

  const status = await api('GET', `/api/rooms/${roomId}/status?faction_id=${myFaction}`);
  startGameLoop(status);
}

// ── Copy Link ───────────────────
function copyLink(btn, url) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = '已复制!';
    setTimeout(() => btn.textContent = '复制链接', 2000);
  });
}

// ── Game Loop ───────────────────
function startGameLoop(initialStatus) {
  show('game-panel');
  updateGameUI(initialStatus);
}

async function refreshGame() {
  const s = await api('GET', `/api/rooms/${roomId}/status?faction_id=${myFaction}`);
  updateGameUI(s);
}

function updateGameUI(s) {
  if (!s.ok) return;

  // Year display — support BC
  const epoch = currentScenario.epoch || '';
  const year = s.year || currentScenario.start_year || 207;
  const season = s.season || '春';
  const quarter = s.quarter || 0;
  el('top-bar').innerHTML = `房间: <b style="color:var(--gold)">${roomId}</b> · ${fmtYear(year, epoch)}${season} · 第${quarter}季`;

  const phase = s.phase;
  const submitted = s.submitted || [];
  const pending = s.pending || [];

  if (phase === 'waiting') {
    if (submitted.includes(myFaction)) {
      el('status-bar').innerHTML = `<span class="ready">✓ 已传令 · 等待: ${pending.join(', ') || '无'}</span>`;
      el('submit-btn').disabled = true;
    } else if (myFaction) {
      el('status-bar').innerHTML = `<span class="waiting">⏳ 请传令 · 已传令: ${submitted.join(', ') || '无'}</span>`;
      el('submit-btn').disabled = false;
    } else {
      el('status-bar').innerHTML = '<span class="waiting">👁 观战中...</span>';
      el('submit-btn').disabled = true;
    }
  } else if (phase === 'resolving') {
    el('status-bar').innerHTML = '<span class="waiting">⚙ 季度推演中...</span>';
    el('submit-btn').disabled = true;
  }

  const turns = s.turns || [];
  if (turns.length > 0) {
    let html = '';
    for (const t of turns) {
      const factionNarrative = t.narratives[myFaction] || '';
      html += `<div class="turn-block">`;
      html += `<div class="turn-header">📜 第${t.quarter||'?'}季 · ${fmtYear(t.year||year, epoch)}${t.season||'?'}</div>`;
      if (factionNarrative) {
        html += `<div class="turn-narrative">${factionNarrative.replace(/\n/g, '<br>')}</div>`;
      }
      if (t.npc_actions && t.npc_actions.length > 0) {
        html += `<div class="turn-npc"><b>天下动向:</b><br>${t.npc_actions.map(a => '· ' + a).join('<br>')}</div>`;
      }
      html += `</div>`;
    }
    el('narrative').innerHTML = html || '<p style="color:var(--muted)">等待第一回合...</p>';
  } else {
    if (s.narrative) {
      el('narrative').innerHTML = s.narrative.replace(/\n/g, '<br>');
    }
    if (s.npc_actions && s.npc_actions.length > 0) {
      el('npc-actions').innerHTML = '<b>天下动向:</b><br>' + s.npc_actions.map(a => '· ' + a).join('<br>');
    }
  }
}

// ── Submit Decision ─────────────
async function doDecide() {
  const decision = el('decision-input').value.trim();
  if (!decision || !myFaction) return;
  el('submit-btn').disabled = true;
  const r = await api('POST', `/api/rooms/${roomId}/decide`, {
    faction_id: myFaction, user_id: myUserId, decision: decision
  });
  if (r.ok) {
    el('decision-input').value = '';
    setTimeout(refreshGame, 500);
  } else {
    alert(r.error);
    el('submit-btn').disabled = false;
  }
}
</script>
</body>
</html>
