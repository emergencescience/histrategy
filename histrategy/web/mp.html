<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三國志略 · 多人对战</title>
<style>
:root {
  --bg: #1a1a2e; --panel: #16213e; --border: #0f3460;
  --gold: #d4a574; --text: #e0d6c2; --muted: #8a8a8a;
  --cao: #4a90d9; --shu: #5cb85c; --wu: #d9534f;
  --btn: #0f3460; --btn-hover: #1a5276;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:"Noto Serif SC","SimSun",serif; min-height:100vh; }
h1 { font-size:1.4em; color:var(--gold); text-align:center; padding:16px 0; }
h2 { font-size:1.1em; color:var(--gold); margin:12px 0 8px; }
.container { max-width:800px; margin:0 auto; padding:16px; }
.panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
input, button { font-family:inherit; font-size:0.95em; }
input { width:100%; padding:10px; background:#1a1a2e; border:1px solid var(--border); color:var(--text); border-radius:6px; margin:6px 0; }
.btn { display:inline-block; padding:10px 20px; background:var(--btn); color:var(--gold); border:1px solid var(--border); border-radius:6px; cursor:pointer; margin:4px; }
.btn:hover { background:var(--btn-hover); }
.btn.primary { background:#2d6a4f; }
.btn:disabled { opacity:0.4; cursor:not-allowed; }
.faction-btn { padding:8px 16px; margin:4px; border-radius:6px; cursor:pointer; background:transparent; font-size:0.95em; }
.faction-btn.cao { border:2px solid var(--cao); color:var(--cao); }
.faction-btn.shu { border:2px solid var(--shu); color:var(--shu); }
.faction-btn.wu  { border:2px solid var(--wu);  color:var(--wu); }
.faction-btn.selected.cao { background:var(--cao); color:#fff; }
.faction-btn.selected.shu { background:var(--shu); color:#fff; }
.faction-btn.selected.wu  { background:var(--wu); color:#fff; }
.faction-btn.taken { opacity:0.3; cursor:not-allowed; text-decoration:line-through; }
.faction-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.85em; margin:0 4px; }
.faction-badge.cao { background:var(--cao); color:#fff; }
.faction-badge.shu { background:var(--shu); color:#fff; }
.faction-badge.wu  { background:var(--wu); color:#fff; }
.slot-row { display:flex; align-items:center; padding:8px; margin:4px 0; background:rgba(255,255,255,0.03); border-radius:6px; flex-wrap:wrap; }
.slot-row .name { min-width:100px; }
.narrative-box { max-height:400px; overflow-y:auto; padding:12px; background:rgba(0,0,0,0.2); border-radius:6px; line-height:1.7; }
#status-bar { text-align:center; padding:8px; font-size:0.9em; color:var(--muted); }
.ready { color:#5cb85c; }
.waiting { color:#d4a574; }
#room-link { background:var(--panel); border:1px solid var(--gold); padding:10px; border-radius:6px; text-align:center; margin:12px 0; word-break:break-all; }
#room-link code { color:var(--gold); font-size:1.1em; }
.hidden { display:none; }
.role-badge { display:inline-block; padding:1px 6px; border-radius:3px; font-size:0.75em; margin-left:4px; }
.role-badge.host { background:var(--gold); color:#1a1a2e; }
.role-badge.player { background:var(--cao); color:#fff; }
</style>
</head>
<body>
<div class="container">
<h1>⚔ 三國志略 · 多人对战</h1>
<div id="room-bar"></div>

<!-- Lobby: Create or Enter -->
<div id="lobby-panel" class="panel">
  <h2>🏯 创建或加入房间</h2>
  <div style="margin:8px 0">
    <input id="name-input" placeholder="你的名字（可选）">
  </div>
  <button class="btn primary" onclick="doCreateRoom()">创建新房间</button>
  <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border)">
    <input id="room-id-input" placeholder="粘贴房间 ID">
    <button class="btn" onclick="doEnterRoom()">进入房间</button>
  </div>
</div>

<!-- Room Lobby (faction selection) -->
<div id="room-lobby-panel" class="panel hidden">
  <h2>选择势力</h2>
  <div id="player-list"></div>
  <div id="faction-buttons" style="margin-top:8px"></div>
  <div id="host-controls" style="margin-top:12px; text-align:center"></div>
</div>

<!-- Game -->
<div id="game-panel" class="panel hidden">
  <div id="status-bar">⏳ 等待...</div>
  <h2>📜 局势推演</h2>
  <div id="narrative" class="narrative-box"></div>
  <div id="npc-actions" style="margin-top:8px"></div>
  <div style="margin-top:12px">
    <input id="decision-input" placeholder="输入你的决策...">
    <button class="btn primary" id="submit-btn" onclick="doDecide()">传令</button>
  </div>
</div>
</div>

<script>
const API = '';
let roomId = '';
let myUserId = 'u_' + Math.random().toString(36).slice(2,8);
let myFaction = '';
let myRole = '';
let pollTimer = null;

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  return r.json();
}
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function el(id) { return document.getElementById(id); }

// ── Create Room ─────────────────────
async function doCreateRoom() {
  const name = el('name-input').value.trim();
  const r = await api('POST', '/api/rooms', { user_id: myUserId, display_name: name });
  if (r.ok) {
    roomId = r.room_id;
    myRole = 'host';
    el('room-bar').innerHTML = `<div id="room-link">房间 ID: <code>${roomId}</code> <br><small>分享此 ID 给其他玩家</small></div>`;
    hide('lobby-panel');
    refreshLobby();
  }
}

// ── Enter Room ──────────────────────
async function doEnterRoom() {
  roomId = el('room-id-input').value.trim();
  if (!roomId) return;
  const name = el('name-input').value.trim();
  const r = await api('POST', `/api/rooms/${roomId}/enter`, { user_id: myUserId, display_name: name });
  if (r.ok) {
    myRole = r.role || 'player';
    el('room-bar').innerHTML = `房间: <b style="color:var(--gold)">${roomId}</b> · 角色: <span class="role-badge ${myRole}">${myRole}</span>`;
    hide('lobby-panel');
    refreshLobby();
  } else {
    alert(r.error);
  }
}

// ── Lobby Refresh (poll faction status) ──
async function refreshLobby() {
  show('room-lobby-panel');
  const status = await api('GET', `/api/rooms/${roomId}/status`);
  if (!status.ok) return;

  const phase = status.phase;
  if (phase !== 'lobby') {
    // Game started!
    hide('room-lobby-panel');
    startGameLoop(status);
    return;
  }

  // Show players
  const plist = el('player-list');
  plist.innerHTML = '<b>房间成员:</b><br>';
  for (const [uid, p] of Object.entries(status.players || {})) {
    const rb = `<span class="role-badge ${p.role}">${p.role}</span>`;
    plist.innerHTML += `· ${p.display_name || uid} ${rb}<br>`;
  }

  // Show faction buttons
  const fb = el('faction-buttons');
  fb.innerHTML = '';
  for (const [fid, s] of Object.entries(status.slots || {})) {
    const taken = s.occupant_type === 'human';
    const isMe = taken && s.occupant_id === myUserId;
    const label = {cao:'曹操(魏)', shu:'刘备(蜀)', wu:'孙权(吴)'}[fid] || fid;
    const btn = document.createElement('button');
    btn.className = `faction-btn ${fid} ${isMe ? 'selected' : ''} ${taken && !isMe ? 'taken' : ''}`;
    btn.textContent = isMe ? `${label} ✓ (你)` : (taken ? `${label} (已选)` : label);
    if (!taken && myRole !== 'spectator') {
      btn.onclick = async () => {
        const r = await api('POST', `/api/rooms/${roomId}/pick`, { user_id: myUserId, faction_id: fid });
        if (r.ok) { myFaction = fid; refreshLobby(); }
        else alert(r.error);
      };
    }
    fb.appendChild(btn);
  }

  // Host controls
  const hc = el('host-controls');
  if (myRole === 'host') {
    const humanCount = Object.values(status.slots || {}).filter(s => s.occupant_type === 'human').length;
    hc.innerHTML = `<button class="btn primary" onclick="doStart()" ${humanCount < 1 ? 'disabled' : ''}>开始游戏</button>`;
  } else {
    hc.innerHTML = '<small style="color:var(--muted)">等待房主开始游戏...</small>';
  }

  // Re-poll
  if (phase === 'lobby') pollTimer = setTimeout(refreshLobby, 2000);
}

// ── Start Game ──────────────────────
async function doStart() {
  const r = await api('POST', `/api/rooms/${roomId}/start`, { user_id: myUserId });
  if (r.ok) {
    clearTimeout(pollTimer);
    hide('room-lobby-panel');
    startGameLoop(r);
  } else {
    alert(r.error);
  }
}

// ── Game Loop ───────────────────────
function startGameLoop(initialStatus) {
  show('game-panel');
  updateGameUI(initialStatus);
  pollTimer = setInterval(async () => {
    const s = await api('GET', `/api/rooms/${roomId}/status?faction_id=${myFaction}`);
    updateGameUI(s);
  }, 2000);
}

function updateGameUI(s) {
  if (!s.ok) return;
  el('room-bar').innerHTML = `房间: <b style="color:var(--gold)">${roomId}</b> · ${s.year||207}年${s.season||'春'} · 第${s.quarter||0}季`;

  const phase = s.phase;
  const submitted = s.submitted || [];
  const pending = s.pending || [];

  if (phase === 'waiting') {
    if (submitted.includes(myFaction)) {
      el('status-bar').innerHTML = `<span class="ready">✓ 已传令 · 等待: ${pending.join(', ') || '无'}</span>`;
      el('submit-btn').disabled = true;
    } else if (myFaction) {
      el('status-bar').innerHTML = `<span class="waiting">⏳ 请传令 · 已传令: ${submitted.join(', ') || '无'}</span>`;
      el('submit-btn').disabled = false;
    } else {
      el('status-bar').innerHTML = '<span class="waiting">👁 观战中...</span>';
      el('submit-btn').disabled = true;
    }
  } else if (phase === 'resolving') {
    el('status-bar').innerHTML = '<span class="waiting">⚙ 季度推演中...</span>';
    el('submit-btn').disabled = true;
  }

  if (s.narrative) {
    el('narrative').innerHTML = s.narrative.replace(/\n/g, '<br>');
  }
  if (s.npc_actions && s.npc_actions.length > 0) {
    el('npc-actions').innerHTML = '<b>天下动向:</b><br>' + s.npc_actions.map(a => '· ' + a).join('<br>');
  }
}

// ── Submit Decision ────────────────
async function doDecide() {
  const decision = el('decision-input').value.trim();
  if (!decision || !myFaction) return;
  el('submit-btn').disabled = true;
  const r = await api('POST', `/api/rooms/${roomId}/decide`, {
    faction_id: myFaction, user_id: myUserId, decision: decision
  });
  if (r.ok) {
    el('decision-input').value = '';
  } else {
    alert(r.error);
    el('submit-btn').disabled = false;
  }
}
</script>
</body>
</html>
